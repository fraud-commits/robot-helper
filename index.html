<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Robot Helper</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.9.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="style.css?v=20261027-03">
</head>
<body>
  <main class="helper-shell">
    <header class="helper-header">
      <div class="helper-brand">ROBOT HELPER</div>
      <div class="mode-switch" role="group" aria-label="Helper mode">
        <button type="button" class="mode-option is-active" data-mode="bet">BET SPREAD</button>
        <span class="mode-track" aria-hidden="true"><span class="mode-thumb"></span></span>
        <button type="button" class="mode-option" data-mode="roulette">ROULETTE LAYOUT</button>
      </div>
      <span class="version-label">HELPER v2026-10-27-03</span>
    </header>
    <section class="helper-content" aria-live="polite">
      <div id="empty-state" class="empty-state">
        <i class="bi bi-bar-chart-line"></i>
        <h2>Select a player in Tableau</h2>
        <p>The filtered rounds will appear here.</p>
      </div>
      <div id="helper-view" class="helper-view" hidden>
        <div class="stats-row"><span>SKIPS: <strong id="skip-count">0</strong></span><span>SHORT BREAKS: <strong id="short-count">0</strong></span><span>LONG BREAKS: <strong id="long-count">0</strong></span></div>
        <h1 id="round-title" class="round-title">Game Round: —</h1>
        <div class="radar-stage"><canvas id="radar-canvas" width="760" height="440" aria-label="Round betting radar"></canvas></div>
        <div class="round-meta" id="round-meta">NET EUR: —</div>
        <div class="controls"><button type="button" class="control-btn" id="add-example">Add Example</button><button type="button" class="control-btn" id="restart-examples">Restart</button><button type="button" class="control-btn" id="generate-jpg">Generate</button></div>
        <div class="examples-heading">EXAMPLES <span id="example-count">0 / 3</span></div>
        <div id="examples-container" class="examples-container"></div>
      </div>
    </section>
  </main>
  <script src="https://code.jquery.com/jquery-3.6.0.js"></script>
  <script src="js/tableau-extensions-1.0.0.min.js"></script>
  <script src="js/application.js?v=20261027-03"></script>
</body>
</html>
